<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Fallback: Redirects after 0 seconds if JavaScript is disabled -->
    <meta http-equiv="refresh" content="0;url=https://ai4gmh.cs.toronto.edu/">
    
    <script>
        // Instant JavaScript redirect
        window.location.replace("https://ai4gmh.cs.toronto.edu/");
    </script>
</head>
<body>
    <!-- Displayed only if both redirection methods fail or take a moment to load -->
    <p>If you are not redirected automatically, follow this <a href="https://example.com">link to the destination</a>.</p>
</body>
</html>
